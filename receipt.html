<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:white;color:black;font-family:sans-serif;padding:20px}
.box{border:2px solid black;padding:20px;max-width:400px;margin:auto}
</style></head><body>
<div class="box">
<h2>Mortuary Receipt</h2>
<p>Receipt No: {{p.receipt_no}}</p>
<p>Body ID: {{p.body_id}}</p>
<p>Amount: GHS {{p.amount}}</p>
<p>Method: {{p.method}}</p>
<p>Date: {{p.date}}</p>
<p>Hospital: {{p.hospital}}</p>
<hr><p>Thank you</p>
<button onclick="window.print()">Print Receipt</button>
</div>
</body></html>
