<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users</title>
<style>body{margin:0;font-family:sans-serif;background:#f1f5f9} .nav{background:#1e293b;color:#fff;padding:10px 14px;display:flex;gap:12px;flex-wrap:wrap;font-size:13px} .nav a{color:#cbd5e1;text-decoration:none} .card{background:#fff;margin:14px;padding:14px;border-radius:10px} input,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #cbd5e1;box-sizing:border-box} button{padding:10px;background:#0ea5e9;border:none;border-radius:8px;color:#fff;font-weight:bold} table{width:100%;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid #e2e8f0}</style></head><body>
