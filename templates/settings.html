<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:20px}input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;box-sizing:border-box}button{padding:12px 16px;background:#0ea5e9;border:none;border-radius:8px;color:#fff;font-weight:bold} .card{background:#1e293b;padding:20px;border-radius:12px;max-width:500px} a{color:#38bdf8;text-decoration:none}</style></head><body>
<a href="/">← Back to Dashboard</a>
<div class="card" style="margin-top:16px">
<h2>Settings</h2>
<form method="POST">
<label>Hospital Name</label>
<select name="hospital">{% for h in hospitals %}<option value="{{ h }}" {% if h==s['hospital'] %}selected{% endif %}>{{ h }}</option>{% endfor %}</select>
<label>Username</label>
<input type="text" name="username" value="{{ s['username'] }}" required>
<label>New Password (leave blank to keep old)</label>
<input type="password" name="password" placeholder="••••••••">
<button type="submit">Save Settings</button>
</form>
<p style="color:#94a3b8;font-size:12px;margin-top:12px">Changes apply immediately. You will stay logged in as new user.</p>
</div></body></html>
