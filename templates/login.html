<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Mortuary Pro</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.card{background:#1e293b;padding:28px;border-radius:16px;width:90%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.5)}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box}button{width:100%;padding:12px;background:#0ea5e9;border:none;border-radius:8px;color:#fff;font-weight:bold;margin-top:10px} .err{background:#7f1d1d;padding:8px;border-radius:6px;margin-bottom:8px;font-size:13px}</style></head><body>
<div class="card">
<h2 style="margin:0 0 10px">Mortuary Pro V4</h2>
<p style="color:#94a3b8;font-size:13px;margin-top:0">Secure login</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p style="color:#475569;font-size:11px;margin-top:12px;text-align:center">Ghana Mortuary Management</p>
</div></body></html>
